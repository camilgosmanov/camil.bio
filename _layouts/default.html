<!DOCTYPE html>
<link rel="stylesheet" href="../assets/css/devicon.min.css">
<html lang="en">
  {% include head.html %}
  <body style="background-color: #1a222c;">

    <!-- Vanta Background Container -->
    <div id="vanta-bg"
         style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
    </div>

    <!-- Header with Icons -->
    <div class="header">
      <h1>
        <span class="site-title">{{ site.username }}</span>
      </h1>

      <div class="header-icons">
        {% if site.linkedin_username %}
        <div class="tooltip">
          <a aria-label="My LinkedIn" target="_blank" href="https://www.linkedin.com/in/camilg">
            <i class="icon fa fa-linkedin" aria-hidden="true"></i>
          </a>
          <span class="tooltiptext">LinkedIn</span>
        </div>
        {% endif %}

        {% if site.github_username %}
        <div class="tooltip">
          <a aria-label="My Github" target="_blank" href="https://github.com/{{ site.github_username }}">
            <i class="icon fa fa-github-alt" aria-hidden="true"></i>
          </a>
          <span class="tooltiptext">Github</span>
        </div>
        {% endif %}

        <div class="tooltip">
          <a aria-label="My Google Scholar" target="_blank"
             href="https://scholar.google.com/citations?user=ZAq-XjwAAAAJ&hl=en&authuser=1">
            <i class="icon fa fa-book" aria-hidden="true"></i>
          </a>
          <span class="tooltiptext">Scholar</span>
        </div>

        <div class="tooltip">
          <a aria-label="View Resume" target="_blank" href="/resume.pdf">
            <i class="icon fa fa-user" aria-hidden="true"></i>
          </a>
          <span class="tooltiptext">Resume</span>
        </div>

        {% if site.email %}
        <div class="tooltip">
          <a aria-label="Send email" href="mailto:{{ site.email }}">
            <i class="icon fa fa-envelope"></i>
          </a>
          <span class="tooltiptext">Email</span>
        </div>
        {% endif %}
      </div>

      <div class="header-links">
        <!-- Optional links -->
      </div>
    </div>

    {{ content }}

    <!-- Vanta.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>

    <script>
      VANTA.CLOUDS({
        el: "#vanta-bg",

  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  skyColor: 0xf5d98,
  speed: 0.70
      });
    </script>

    <!-- Prevent Vanta from hijacking icon interactions -->
    <script>
      const iconContainer = document.querySelector('.header-icons');

      ['touchstart', 'touchmove', 'touchend',
       'pointerdown', 'pointermove', 'pointerup']
      .forEach(eventType => {
        iconContainer?.addEventListener(eventType, function(event) {
          event.stopImmediatePropagation();
        }, { passive: false, capture: true });
      });
    </script>

  </body>
</html>
